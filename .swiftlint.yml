# SwiftLint (runs as a build tool plugin of both targets, see project.yml).
# Tuned to the code's style: short names in geometry and math (p, t, w, dx), trailing
# commas in multi-line literals, one-line `else if` chains, ternaries that toggle.

included:
  - Presently
  - PresentlyTests

disabled_rules:
  - identifier_name
  - trailing_comma
  - statement_position
  - void_function_in_ternary
  - implicit_optional_initialization   # `= nil` spells out the memberwise-init default

opt_in_rules:
  - empty_count
  - first_where
  - contains_over_filter_count
  - last_where
  - sorted_first_last
  - toggle_bool

line_length:
  warning: 160
  error: 250
  ignores_comments: true
  ignores_urls: true
  # Lines that are one string literal: localized help text (the key is the English text) and
  # PDF or pdfpc fixtures. Breaking them would change the string.
  excluded_lines_patterns:
    - 'String\(localized: "'
    - '^\s*Text\("'
    - '^\s*(static )?let \w+ = #?"'

cyclomatic_complexity:
  ignores_case_statements: true

function_body_length:
  warning: 80
  error: 150

type_body_length:
  warning: 350
  error: 500

file_length:
  warning: 650
  error: 1000

large_tuple:
  warning: 4

nesting:
  type_level: 2

function_parameter_count:
  warning: 8
