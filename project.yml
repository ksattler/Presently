name: Presently
options:
  minimumXcodeVersion: "15.0"
  developmentLanguage: en
  xcodeVersion: "27.0"
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"        # release builds override it (scripts/release.sh)
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.6.0
  SwiftLintPlugins:
    url: https://github.com/SimplyDanny/SwiftLintPlugins
    exactVersion: 0.65.1   # same as `brew install swiftlint`, so command line and build agree

targets:
  Presently:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Presently
    dependencies:
      - package: Sparkle
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugins
    entitlements:
      path: Presently/Presently.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kus.presently.app
        DEVELOPMENT_TEAM: 7XW8432Z53
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Presently/Presently.entitlements
    scheme:
      testTargets:
        - PresentlyTests
    info:
      path: Presently/Info.plist
      properties:
        CFBundleDisplayName: Presently
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 Kai-Uwe Sattler"
        CFBundleLocalizations:
          - en
          - de
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.productivity
        # Sparkle: appcast.xml is an asset of every GitHub release (scripts/release.sh), so this
        # URL always points to the latest published one; drafts stay invisible.
        SUFeedURL: https://github.com/ksattler/Presently/releases/latest/download/appcast.xml
        SUPublicEDKey: "a5wc3IxJhtQ4VyE9+hPHmVrFF+AvVg1d3oKc8AL52Uw="
        SUEnableAutomaticChecks: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf

  PresentlyTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PresentlyTests
    dependencies:
      - target: Presently
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.presently.app.tests
        # Same team as the app: the hardened runtime only loads a test bundle signed by the host's team.
        DEVELOPMENT_TEAM: 7XW8432Z53
        GENERATE_INFOPLIST_FILE: YES
