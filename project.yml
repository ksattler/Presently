name: Presently
options:
  minimumXcodeVersion: "15.0"
  developmentLanguage: en
  xcodeVersion: "27.0"
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Presently:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Presently
    entitlements:
      path: Presently/Presently.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kus.presently.app
        DEVELOPMENT_TEAM: 7XW8432Z53
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Presently/Presently.entitlements
    scheme:
      testTargets:
        - PresentlyTests
    info:
      path: Presently/Info.plist
      properties:
        CFBundleDisplayName: Presently
        NSHumanReadableCopyright: "© 2026 Kai-Uwe Sattler"
        CFBundleLocalizations:
          - en
          - de
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf

  PresentlyTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PresentlyTests
    dependencies:
      - target: Presently
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.presently.app.tests
        GENERATE_INFOPLIST_FILE: YES
