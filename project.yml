name: Presently
options:
  minimumXcodeVersion: "15.0"
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Presently:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Presently
    entitlements:
      path: Presently/Presently.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.presently.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Presently/Presently.entitlements
    scheme:
      testTargets:
        - PresentlyTests
    info:
      path: Presently/Info.plist
      properties:
        CFBundleDisplayName: Presently
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf

  PresentlyTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PresentlyTests
    dependencies:
      - target: Presently
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.presently.app.tests
        GENERATE_INFOPLIST_FILE: YES
