name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # Ad-hoc signing: the runner has no Developer ID certificate for the team.
      # -skipPackagePluginValidation: trusts the SwiftLint build tool plugin (Xcode asks once).
      - name: Test
        run: |
          xcodebuild test -project Presently.xcodeproj -scheme Presently \
            -destination 'platform=macOS' -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            | tee xcodebuild.log
          exit ${PIPESTATUS[0]}

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
